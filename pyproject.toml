[project]
name = "synthetic-data-gen"
version = "1.0.0"
description = "Privacy-preserving tabular synthetic data generator with Differential Privacy and statistical validation reports in Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
